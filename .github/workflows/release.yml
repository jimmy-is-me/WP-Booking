name: Release WP Booking

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: wp-booking-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove legacy public license server ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=$(gh release view v1.4.1 --json assets --jq '.assets[].name')
          if grep -Fxq 'wp-booking-license-server.zip' <<< "$assets"; then
            gh release delete-asset v1.4.1 wp-booking-license-server.zip --yes
          fi

      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(awk '/^ \* Version:/ {print $3; exit}' wp-booking.php)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fx "const VERSION = '$version';" wp-booking.php
          tag="v$version"

          if git show-ref --verify --quiet "refs/tags/$tag"; then
            git checkout --detach "$tag"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists."
              exit 0
            fi
          fi

          find includes -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l wp-booking.php
          php tests/shared-license.php
          for js in assets/*.js; do node --check "$js"; done

          stage=$(mktemp -d)
          mkdir -p "$stage/wp-booking"
          cp -r wp-booking.php includes assets README.md "$stage/wp-booking/"

          (cd "$stage" && zip -qr "$RUNNER_TEMP/wp-booking.zip" wp-booking)
          unzip -tq "$RUNNER_TEMP/wp-booking.zip"

          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            git tag "$tag"
            git push origin "refs/tags/$tag"
          fi

          gh release create "$tag" --verify-tag --title "WP Booking $tag" --generate-notes \
            "$RUNNER_TEMP/wp-booking.zip"
